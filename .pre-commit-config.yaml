repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        files: ^(code/web_application/.*\.py|scripts/hw07/.*\.py|tests/test_hw07.*\.py|src/bikeshare/.*\.py|experiments/hw07/.*\.py|src/tool_agent/.*\.py|src/model_client\.py|src/rental_tools/executor\.py)$
      - id: ruff-format
        types_or: [python, pyi]
        files: ^(code/web_application/.*\.py|scripts/hw07/.*\.py|tests/test_hw07.*\.py|src/bikeshare/.*\.py|experiments/hw07/.*\.py|src/tool_agent/.*\.py|src/model_client\.py|src/rental_tools/executor\.py)$
