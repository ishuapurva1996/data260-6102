<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW1-Pragya_Apurva</title>
    <link rel="stylesheet" href="css_style.css">
</head>

<body>
    <h1>Rental Housing Listings</h1>
    <form id="rentalForm">
        <label for="listingTitle">Listing Title <sup>*</sup></label>
        <input type="text" id="listingTitle" name="listingTitle" placeholder="ex: Zia Apartment" required autofocus>
        <br><br>

        <label for="propertyAddress">Address <sup>*</sup></label>
        <input type="text" id="propertyAddress" name="propertyAddress" placeholder="ex: 999 Main Street, CA" required>
        <br><br>

        <label for="submitterEmail">Landlord Email <sup>*</sup></label>
        <input type="email" id="submitterEmail" name="submitterEmail" placeholder="landlord@email.com" required>
        <br><br>

        <label for="description">Description <sup>*</sup></label>
        <textarea name="description" id="description" placeholder="e.g., Spacious two-bedroom apartment with parking"
            rows="3" cols="40" required></textarea>
        <br><br>

        <label for="propertyType">Property Type</label>
        <select name="propertyType" id="propertyType" required>
            <option value="" selected disabled>Choose</option>
            <option value="apartment">apartment</option>
            <option value="house">house</option>
            <option value="condo">condo</option>
            <option value="townhouse">townhouse</option>
        </select>

        <br><br>

        <input type="checkbox" id="termsAccepted" name="termsAccepted">
        <label for="termsAccepted">I agree to the terms and conditions.</label>
        <br><br>

        <button type="submit">Create Rental Listing</button>

    </form>

    <h2>Submitted Rental Listings</h2>
    <ul id="rentalList"></ul>

    <script src="script_hw.js"></script>
</body>

</html>
